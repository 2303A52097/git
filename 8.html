<!DOCT<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎟️ Movie Ticket Booking System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ffcc00;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background-color: #2c2c3c;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px #000;
    }
    select, button {
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }
    button {
      background-color: #ffcc00;
      color: #000;
      cursor: pointer;
    }
    button:hover {
      background-color: #ffaa00;
    }
    .seats {
      display: grid;
      grid-template-columns: repeat(8, 40px);
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    .seat {
      width: 40px;
      height: 40px;
      background-color: #444;
      border-radius: 5px;
      text-align: center;
      line-height: 40px;
      cursor: pointer;
    }
    .booked {
      background-color: #e50914;
      cursor: not-allowed;
    }
    .selected {
      background-color: #00ff99;
    }
    .summary {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🎬 Movie Ticket Booking System</h1>
  <div class="container">
    <div>
      <label for="movie">Select Movie:</label>
      <select id="movie">
        <option value="Avengers">Avengers: Endgame</option>
        <option value="Inception">Inception</option>
        <option value="Jawan">Jawan</option>
      </select>

      <label for="showtime">Showtime:</label>
      <select id="showtime">
        <option value="10:00 AM">10:00 AM</option>
        <option value="2:00 PM">2:00 PM</option>
        <option value="6:00 PM">6:00 PM</option>
      </select>

      <button id="bookBtn">Book Ticket</button>
      <button id="cancelBtn">Cancel Booking</button>
    </div>

    <div class="seats" id="seatsContainer"></div>

    <div class="summary">
      <p id="summaryText">No booking yet.</p>
    </div>
  </div>

  <script>
    class Movie {
      constructor(title, showtimes) {
        this.title = title;
        this.showtimes = showtimes;
      }
    }

    class Theater {
      constructor() {
        this.seats = Array(24).fill(false); // false = available
      }

      isSeatAvailable(index) {
        return !this.seats[index];
      }

      bookSeat(index) {
        if (this.seats[index]) return false;
        this.seats[index] = true;
        return true;
      }

      cancelSeat(index) {
        this.seats[index] = false;
      }
    }

    class Ticket {
      constructor(movie, time, seatNumber) {
        this.movie = movie;
        this.time = time;
        this.seatNumber = seatNumber;
        this.price = 200;
      }
    }

    class Booking {
      constructor(theater) {
        this.theater = theater;
        this.bookings = [];
      }

      makeBooking(movie, time, seatNumber) {
        if (!this.theater.isSeatAvailable(seatNumber)) {
          alert("❌ Seat already booked! Choose another seat.");
          return null;
        }
        this.theater.bookSeat(seatNumber);
        const ticket = new Ticket(movie, time, seatNumber);
        this.bookings.push(ticket);
        return ticket;
      }

      cancelBooking(seatNumber) {
        const index = this.bookings.findIndex(b => b.seatNumber === seatNumber);
        if (index !== -1) {
          this.theater.cancelSeat(seatNumber);
          const refund = this.bookings[index].price;
          this.bookings.splice(index, 1);
          alert(`✅ Booking cancelled! ₹${refund} refunded.`);
        } else {
          alert("⚠️ No booking found for this seat.");
        }
      }
    }

    const theater = new Theater();
    const bookingSystem = new Booking(theater);
    const seatsContainer = document.getElementById("seatsContainer");
    const summaryText = document.getElementById("summaryText");
    const bookBtn = document.getElementById("bookBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const movieSelect = document.getElementById("movie");
    const timeSelect = document.getElementById("showtime");
    let selectedSeat = null;

    // Generate seats
    for (let i = 0; i < 24; i++) {
      const seat = document.createElement("div");
      seat.classList.add("seat");
      seat.textContent = i + 1;
      seat.addEventListener("click", () => selectSeat(i, seat));
      seatsContainer.appendChild(seat);
    }

    function selectSeat(index, element) {
      if (theater.seats[index]) {
        alert("❌ Seat already booked!");
        return;
      }
      document.querySelectorAll(".seat").forEach(seat => seat.classList.remove("selected"));
      element.classList.add("selected");
      selectedSeat = index;
    }

    bookBtn.addEventListener("click", () => {
      if (selectedSeat === null) {
        alert("⚠️ Please select a seat first!");
        return;
      }
      const movie = movieSelect.value;
      const time = timeSelect.value;
      const ticket = bookingSystem.makeBooking(movie, time, selectedSeat);
      if (ticket) {
        alert(`🎟️ Seat ${selectedSeat + 1} booked successfully!`);
        renderSeats();
        summaryText.textContent = `You booked seat ${selectedSeat + 1} for '${movie}' at ${time}.`;
        selectedSeat = null;
      }
    });

    cancelBtn.addEventListener("click", () => {
      if (selectedSeat === null) {
        alert("⚠️ Select a seat to cancel booking.");
        return;
      }
      bookingSystem.cancelBooking(selectedSeat);
      renderSeats();
      summaryText.textContent = "Booking cancelled. Seat is now available.";
      selectedSeat = null;
    });

    function renderSeats() {
      const allSeats = document.querySelectorAll(".seat");
      allSeats.forEach((seat, i) => {
        seat.classList.remove("booked", "selected");
        if (theater.seats[i]) {
          seat.classList.add("booked");
        }
      });
    }
  </script>
</body>
</html>
